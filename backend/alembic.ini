# backend/alembic.ini
# LifeLink AI — Alembic Database Migration Configuration
# Architecture Reference: ARCHITECTURE.md Section 24 (Database Overview)
# Rule: Migrations managed exclusively via Alembic — no manual SQL on production

[alembic]
# Path to migration scripts
script_location = alembic

# Template to use for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Database URL — overridden by env variable in alembic/env.py
# Do NOT put real credentials here
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/lifelink_db

[post_write_hooks]
# Run Ruff formatter after generating new migration files
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
