# backend/pyproject.toml
# LifeLink AI — Backend Project Configuration
# Architecture Reference: ARCHITECTURE.md Section 31 (Coding Standards)
# Configures: Ruff (linter + formatter), mypy (type checker)

[tool.ruff]
# Ruff configuration — replaces Black, isort, flake8, pylint, and more
target-version = "py311"
line-length = 88
src = ["app"]
exclude = [
    ".git",
    "__pycache__",
    "alembic/versions",
    ".venv",
    "venv",
    ".ruff_cache",
]

[tool.ruff.lint]
# Enable rule categories
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (catches accidental print statements)
    "N",    # pep8-naming
]
ignore = [
    "E501",   # Line too long — handled by formatter
    "B008",   # Do not perform function calls in default argument values
    "N805",   # First argument of a method should be named `self` — conflicts with Pydantic validators
]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "alembic"]
known-first-party = ["app"]

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ===========================================================================
# mypy — Type Checking Configuration
# ===========================================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false

# Exclude generated files
exclude = [
    "alembic/versions/",
    "venv/",
    ".venv/",
]

# Plugin support for SQLAlchemy and Pydantic
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "firebase_admin.*",
    "aiosmtplib.*",
    "structlog.*",
]
ignore_missing_imports = true

# ===========================================================================
# pytest — Test Configuration
# ===========================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]

# ===========================================================================
# Coverage
# ===========================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ===========================================================================
# Project Metadata
# ===========================================================================
[project]
name = "lifelink-ai-backend"
version = "1.0.0-alpha"
description = "LifeLink AI — Emergency Blood and Organ Intelligence Platform — Backend API"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
